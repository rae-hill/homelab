name: Setup
description: Perform standard setup and install dependencies using yarn.
inputs:
  fetch-depth:
    description: Depth passed to actions/checkout. Use "0" (full history + tags) for jobs that analyze git history, e.g. semantic-release.
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - name: Install Yarn
      shell: bash
      run: corepack enable
    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        package-manager-cache: "false"
        cache: "yarn"
    - name: Install dependencies
      shell: bash
      # skip-build: CI runners lack the Nix tooling (yarn-berry-fetcher) that the root
      # postinstall needs to regenerate missing-hashes.json (which is committed anyway),
      # and dependency build scripts are blocked by Yarn 4 defaults regardless.
      run: yarn install --mode=skip-build
