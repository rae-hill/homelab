name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: yarn typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: yarn lint

  circular:
    name: Circular Deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: yarn circular

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      # The test suite reads generated fixtures from packages/homelab-services-node/private/
      # (gitignored; real ones are sops-managed). Stage fresh random ones for the runner.
      - name: Stage test secrets
        run: node scripts/stage-test-secrets.mjs
      - run: yarn test
        env:
          NODE_OPTIONS: --max_old_space_size=8192

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      # scripts/e2e.sh bootstraps the machine-local server fixtures itself
      # (generated, non-secret: .env-serve-test + private/ keys — see
      # scripts/stage-e2e-secrets.mjs), builds the rolldown bundle, starts the
      # server on :54328, and runs the suite against it (server logs land in
      # .e2e-log-dump.txt). Deliberately NO Nix and NO chrome here:
      # CHROME_EXECUTABLE is unset on runners, so the live resume-print
      # success test self-skips and puppeteer never launches a browser.
      - name: Run e2e suite (bundled server)
        run: bash scripts/e2e.sh

  nix-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check Nix configurations
        run: nix flake check --no-build
        env:
          DPRINT_CACHE_DIR: ${{ runner.temp }}/dprint-cache
