<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identity -->
    <title>Rae Hill</title>
    <meta name="description" content="My resume and general home page" />
    <link rel="canonical" href="https://resume.rae-hill.dev/" />

    <!-- Opt out of AI crawling / training (preserved from the Docusaurus config) -->
    <meta name="robots" content="noai,noimageai" />

    <!-- Favicons / manifest (served from /public) -->
    <link rel="icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/img/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/img/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#BBF7D0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Victor+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    />

    <!-- Preload the parallax backdrop -->
    <link rel="preload" as="image" href="/img/cherry-blossom-gaussian.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
