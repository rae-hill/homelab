# :schema https://secretspec.dev/schema/secretspec.schema.json

# ROOT SecretSpec manifest for the fleet (docs/secretspec-migration-plan.md).
#
# Layout: ONE root manifest, profile = host. Module parent specs (extended
# below) declare each service's secrets in the profile(s) of the hosts that
# run them; this file binds ALL provider aliases — relative sops:// URIs
# resolve against THIS file's directory (nix-config/), and multi-level ../
# paths break URL dot-segment normalization, so every path here is
# forward-relative. Host-specific secrets (no owning module) are declared
# here directly in their host's profile.
#
# Usage:
#   cd nix-config && secretspec check --profile augustus [--scope kanidm]
#   (Phase 3: the bridge unit resolves export --profile <host> --scope <svc>)
#
# host_op_* aliases are null:// placeholders until Phase 4 creates the
# 1Password vaults + service accounts; then they flip to
# "onepassword+token://homelab-<host>" (token via provider credentials —
# NEVER in the URI) and per-service sops aliases drop out of the chains.

[project]
name = "homelab"
revision = "1.0"
# Agents (opencode etc.) must state a reason before resolving secrets;
# recorded in the local audit log. Convention anchor for all parent specs
# (a future nix-config/shared-secrets/ parent must declare ≥1 secret to
# parse, so conventions live here until one exists).
require_reason = "agents"
extends = [
  "modules/identity/identity-kanidm",
  "modules/identity/identity-step-ca",
  "modules/ai/ai-openwebui",
  "modules/ai/ai-openclaw",
  "modules/ai/ai-opencode",
  "modules/apps/apps-home-assistant",
  "modules/apps/apps-planka",
  "modules/apps/apps-habitsync",
  "modules/apps/apps-minecraft",
  "modules/networking/networking-radius",
  "modules/networking/networking-unpoller",
  "modules/networking/networking-technitium",
  "modules/observability/observability-grafana",
  "modules/observability/observability-prometheus",
  "modules/homelab/homelab-api",
  "modules/homelab/homelab-ssh-cert-renewer",
]

[providers]
# --- 1Password service accounts (Phase 4) ---
host_op_augustus = "null://" # -> "onepassword+token://homelab-augustus"
host_op_nixos = "null://" # -> "onepassword+token://homelab-nixos"
host_op_mini = "null://" # -> "onepassword+token://homelab-mini"
# --- interim sops files: module-local ---
sops_kanidm = "sops://modules/identity/identity-kanidm/secrets/augustus.yaml"
sops_openwebui = "sops://modules/ai/ai-openwebui/secrets/augustus.yaml"
sops_home_assistant = "sops://modules/apps/apps-home-assistant/secrets/augustus.yaml"
sops_planka = "sops://modules/apps/apps-planka/secrets/augustus.yaml"
sops_habitsync = "sops://modules/apps/apps-habitsync/secrets/augustus.yaml"
sops_minecraft = "sops://modules/apps/apps-minecraft/secrets/augustus.yaml"
sops_radius = "sops://modules/networking/networking-radius/secrets/augustus.yaml"
sops_unpoller = "sops://modules/networking/networking-unpoller/secrets/augustus.yaml"
sops_technitium_oidc = "sops://modules/networking/networking-technitium/secrets/augustus.yaml"
sops_grafana = "sops://modules/observability/observability-grafana/secrets/augustus.yaml"
sops_technitium_metrics = "sops://modules/observability/observability-prometheus/secrets/augustus.yaml"
sops_homelab_api_augustus = "sops://modules/homelab/homelab-api/secrets/augustus.yaml"
sops_homelab_api_prae = "sops://modules/homelab/homelab-api/secrets/praeconinus.yaml"
sops_renewer_augustus = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/augustus.yaml"
sops_renewer_cicero = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/cicero.yaml"
sops_renewer_nixos = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/nixos.yaml"
sops_renewer_aedilis = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/aedilis.yaml"
sops_stepca_cicero = "sops://modules/identity/identity-step-ca/secrets/cicero.yaml"
sops_openclaw_mini = "sops://modules/ai/ai-openclaw/secrets/mini.yaml"
sops_opencode_nixos = "sops://modules/ai/ai-opencode/secrets/nixos.yaml"
# --- interim sops files: host-local (host-* Nix modules own these secrets) ---
sops_smb_augustus = "sops://system-configs/augustus/secrets/smb.yaml"
sops_failure_notifs_augustus = "sops://system-configs/augustus/secrets/failure-notifs.yaml"
sops_postgres_augustus = "sops://system-configs/augustus/secrets/postgres.yaml"
sops_stepca_oidc_augustus = "sops://system-configs/augustus/secrets/step-ca.yaml"
sops_api_extras_augustus = "sops://system-configs/augustus/secrets/homelab-api.yaml"
sops_smb_nixos = "sops://system-configs/nixos/secrets/smb.yaml"
sops_technitium_aedilis = "sops://system-configs/aedilis/secrets/technitium.yaml"

# ---------------------------------------------------------------------------
# Host-specific secrets (declared by host-* Nix modules; no shared module owns
# them). Service secrets come from the extended module specs' host profiles.
# ---------------------------------------------------------------------------

[profiles.augustus]
smb_passphrase = { description = "CIFS passphrase for the /mnt/backups automount (smb-creds template)", providers = ["sops_smb_augustus"] }
pushover_user_key = { description = "Pushover user key for failure-notifs", providers = ["host_op_augustus", "sops_failure_notifs_augustus"] }
pushover_token = { description = "Pushover API token for failure-notifs", providers = ["host_op_augustus", "sops_failure_notifs_augustus"] }
postgres_restic_backup_passphrase = { description = "restic repo passphrase for the postgres dump backup", providers = ["host_op_augustus", "sops_postgres_augustus"] }
step_ca_oidc_client_secret = { description = "kanidm-issued OIDC client secret for step-ca", providers = ["host_op_augustus", "sops_stepca_oidc_augustus"] }
homelab_api_key_jacob = { description = "homelab-api personal API key (jacob)", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
homelab_api_openrouter_key = { description = "OpenRouter key for POST /resume/tailor", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
ipad_serial_number = { description = "iPad serial for the EAP-TLS serial-numbers-file", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
iphone_serial_number = { description = "iPhone serial for the EAP-TLS serial-numbers-file", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
# NOTE: secrets/step-ca.yaml also carries step_ca_ssh_host_augustus_provisioner_passphrase,
# declared by NOTHING (dead key carried through both migrations).

[profiles.nixos]
smb_passphrase = { description = "CIFS passphrase for the /mnt/backups automount (smb-creds template)", providers = ["sops_smb_nixos"] }
jacob_smb_passphrase = { description = "CIFS passphrase for /home/jacob/cloud (jacob-smb-creds template)", providers = ["sops_smb_nixos"] }

[profiles.aedilis]
technitium_admin_password = { description = "technitium web console admin password (first-start bootstrap)", providers = ["sops_technitium_aedilis"] }
technitium_sso_client_secret = { description = "OIDC/SSO client secret for the kanidm-registered technitium client", providers = ["sops_technitium_aedilis"] }
technitium_pkcs12_password = { description = "PKCS#12 bundle password for the DoT/DoQ/DoH listener", providers = ["sops_technitium_aedilis"] }
technitium_metrics_user_password = { description = "password of the limited prometheus metrics user", providers = ["sops_technitium_aedilis"] }
technitium_provisioner_password = { description = "password of the least-privilege provisioner API user (token broker)", providers = ["sops_technitium_aedilis"] }
technitium_metrics_totp_secret = { description = "TOTP seed of the metrics user — NOT consumed by Nix config; captured out-of-band per the deployment runbook §7", required = false, providers = ["sops_technitium_aedilis"] }

# ---------------------------------------------------------------------------
# Host-specific scopes (service scopes come from the module specs; scope
# resolution intersects with the selected profile, so e.g. the `smb` scope
# serves both augustus and nixos with their own declarations).
# ---------------------------------------------------------------------------

[scopes.smb]
secrets = ["smb_passphrase", "jacob_smb_passphrase"]

[scopes.failure-notifs]
secrets = ["pushover_user_key", "pushover_token"]

[scopes.postgres-backup]
secrets = ["postgres_restic_backup_passphrase"]

[scopes.step-ca-oidc]
secrets = ["step_ca_oidc_client_secret"]

[scopes.homelab-api-extras]
secrets = [
  "homelab_api_key_jacob",
  "homelab_api_openrouter_key",
  "ipad_serial_number",
  "iphone_serial_number",
]

[scopes.technitium]
secrets = [
  "technitium_admin_password",
  "technitium_sso_client_secret",
  "technitium_pkcs12_password",
  "technitium_metrics_user_password",
  "technitium_provisioner_password",
  "technitium_metrics_totp_secret",
]
