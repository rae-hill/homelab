# :schema https://secretspec.dev/schema/secretspec.schema.json

# ROOT SecretSpec manifest — PURE COMPOSITION (docs/secretspec-migration-plan.md).
#
# Every secret is declared exactly once, beside the Nix module that consumes
# it: service secrets in modules/<cat>/<module>/secretspec.toml, host-specific
# secrets in system-configs/<host>/secretspec.toml. This file only:
#   1. extends the parent specs (all of them, profiles separate the hosts),
#   2. binds the host_op_* placeholders — the per-host 1Password service
#      account aliases that module/host chains reference (null:// until
#      Phase 4 flips them to "onepassword+token://homelab-<host>"; SA token
#      via provider credentials, NEVER in the URI),
#   3. carries the fleet-wide conventions (project name, require_reason).
#
# Why here: relative sops:// URIs rebase against the ROOT manifest directory
# (nix-config/), and multi-level ../ paths break URL dot-segment normalization
# — so parents spell alias paths forward-relative to this directory, and this
# file must sit at nix-config/. The empty [profiles] table keeps this document
# valid (every secretspec.toml must declare the profiles field); all profile
# content comes from the parents.
#
# Usage: cd nix-config && secretspec check --profile <host> [--scope <svc>]
#        (or the devshell helper: secrets-check <host> [--scope <svc>])

[project]
name = "homelab"
revision = "1.0"
# Agents (opencode etc.) must state a reason before resolving secrets;
# recorded in the local audit log.
require_reason = "agents"
extends = [
  "modules/identity/identity-kanidm",
  "modules/identity/identity-step-ca",
  "modules/ai/ai-openwebui",
  "modules/ai/ai-openclaw",
  "modules/ai/ai-opencode",
  "modules/apps/apps-home-assistant",
  "modules/apps/apps-planka",
  "modules/apps/apps-habitsync",
  "modules/apps/apps-minecraft",
  "modules/networking/networking-radius",
  "modules/networking/networking-unpoller",
  "modules/networking/networking-technitium",
  "modules/observability/observability-grafana",
  "modules/observability/observability-prometheus",
  "modules/homelab/homelab-api",
  "modules/homelab/homelab-ssh-cert-renewer",
  "system-configs/augustus",
  "system-configs/nixos",
  "system-configs/aedilis",
]

[providers]
host_op_augustus = "null://" # Phase 4: "onepassword+token://homelab-augustus"
host_op_nixos = "null://" # Phase 4: "onepassword+token://homelab-nixos"
host_op_mini = "null://" # Phase 4: "onepassword+token://homelab-mini"

[profiles]
