# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the technitium-metrics module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "technitium-metrics"
revision = "1.0"

[providers]
sops_technitium_metrics = "sops://modules/observability/observability-prometheus/secrets/augustus.yaml"

[profiles.augustus]
technitium_metrics_user_password = { description = "technitium prometheus metrics-user password (metrics-token oneshot)", providers = ["host_op_augustus", "sops_technitium_metrics"] }
technitium_metrics_totp_secret = { description = "TOTP seed of the technitium metrics user (metrics-token oneshot)", providers = ["host_op_augustus", "sops_technitium_metrics"] }

[scopes.technitium-metrics]
secrets = [
  "technitium_metrics_user_password",
  "technitium_metrics_totp_secret",
]
