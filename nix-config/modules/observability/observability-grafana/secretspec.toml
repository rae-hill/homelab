# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the grafana module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs. ALL provider aliases
# are bound by the ROOT manifest (nix-config/secretspec.toml): relative
# sops:// URIs resolve against the root manifest's directory, and
# multi-level ../ paths break URL dot-segment normalization — the root
# binds forward-relative paths only. See docs/secretspec-migration-plan.md.

[project]
name = "grafana"
revision = "1.0"

[profiles.augustus]
grafana_client_secret = { description = "OIDC client secret (kanidm-issued; grafana-client-secret template)", providers = ["host_op_augustus", "sops_grafana"] }
grafana_secret = { description = "grafana security.secret_key", providers = ["host_op_augustus", "sops_grafana"] }
grafana_pushover_user_key = { description = "Pushover user key for grafana alerting", providers = ["host_op_augustus", "sops_grafana"] }
grafana_pushover_token = { description = "Pushover API token for grafana alerting", providers = ["host_op_augustus", "sops_grafana"] }

[scopes.grafana]
secrets = [
  "grafana_client_secret",
  "grafana_secret",
  "grafana_pushover_user_key",
  "grafana_pushover_token",
]
