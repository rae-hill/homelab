# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the technitium module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "technitium"
revision = "1.0"

[providers]
sops_technitium_oidc = "sops://modules/networking/networking-technitium/secrets/augustus.yaml"

[profiles.augustus]
technitium_client_secret = { description = "OIDC client secret for the technitium admin-UI SSO (kanidm provision)", providers = ["host_op_augustus", "sops_technitium_oidc"] }

[scopes.technitium-oidc]
secrets = [
  "technitium_client_secret",
]
