# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the ssh-cert-renewer module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "ssh-cert-renewer"
revision = "1.0"

[providers]
sops_renewer_augustus = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/augustus.yaml"
sops_renewer_cicero = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/cicero.yaml"
sops_renewer_nixos = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/nixos.yaml"
sops_renewer_aedilis = "sops://modules/homelab/homelab-ssh-cert-renewer/secrets/aedilis.yaml"

[profiles.augustus]
step_jwk_provisioner_password = { description = "step-ca JWK provisioner password for SSH host-cert renewal (LIFELINE: local files permanently, plan §6)", providers = ["sops_renewer_augustus"] }

[profiles.cicero]
step_jwk_provisioner_password = { description = "step-ca JWK provisioner password for SSH host-cert renewal (LIFELINE: local files permanently, plan §6)", providers = ["sops_renewer_cicero"] }

[profiles.nixos]
step_jwk_provisioner_password = { description = "step-ca JWK provisioner password for SSH host-cert renewal (LIFELINE: local files permanently, plan §6)", providers = ["sops_renewer_nixos"] }

[profiles.aedilis]
step_jwk_provisioner_password = { description = "step-ca JWK provisioner password for SSH host-cert renewal (LIFELINE: local files permanently, plan §6)", providers = ["sops_renewer_aedilis"] }

[scopes.ssh-cert-renewer]
secrets = [
  "step_jwk_provisioner_password",
]
