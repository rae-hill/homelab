# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the homelab-api module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "homelab-api"
revision = "1.0"

[providers]
sops_homelab_api_augustus = "sops://modules/homelab/homelab-api/secrets/augustus.yaml"
sops_homelab_api_prae = "sops://modules/homelab/homelab-api/secrets/praeconinus.yaml"

[profiles.augustus]
homelab_api_jwk_password = { description = "passphrase for the token-issuer JWK (privateKeySecretPath + homelab-api-env)", providers = ["host_op_augustus", "sops_homelab_api_augustus"] }

[profiles.praeconinus]
homelab_api_jwk_password = { description = "passphrase for the token-issuer JWK (privateKeySecretPath + homelab-api-env)", providers = ["sops_homelab_api_prae"] }

[scopes.homelab-api]
secrets = [
  "homelab_api_jwk_password",
]
