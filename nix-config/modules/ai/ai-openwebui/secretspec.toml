# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the openwebui module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "openwebui"
revision = "1.0"

[providers]
sops_openwebui = "sops://modules/ai/ai-openwebui/secrets/augustus.yaml"

[profiles.augustus]
openwebui_client_secret = { description = "OIDC client secret (kanidm-issued; openwebui-env template)", providers = ["host_op_augustus", "sops_openwebui"] }
openwebui_app_secret_key = { description = "WEBUI_SECRET_KEY (openwebui-env template)", providers = ["host_op_augustus", "sops_openwebui"] }
openwebui_restic_backup_passphrase = { description = "restic repo passphrase for openwebui backups", providers = ["host_op_augustus", "sops_openwebui"] }

[scopes.openwebui]
secrets = [
  "openwebui_client_secret",
  "openwebui_app_secret_key",
  "openwebui_restic_backup_passphrase",
]
