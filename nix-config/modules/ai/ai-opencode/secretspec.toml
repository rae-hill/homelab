# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the opencode module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "opencode"
revision = "1.0"

[providers]
sops_opencode_nixos = "sops://modules/ai/ai-opencode/secrets/nixos.yaml"

[profiles.nixos]
qwen_openai_key = { description = "QwenCloud token-plan API key (alibaba provider; consumed by home-manager)", providers = ["host_op_nixos", "sops_opencode_nixos"] }
openrouter_api_key = { description = "OpenRouter API key (openrouter provider; consumed by home-manager)", providers = ["host_op_nixos", "sops_opencode_nixos"] }

[scopes.opencode]
secrets = [
  "qwen_openai_key",
  "openrouter_api_key",
]
