# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the openclaw module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "openclaw"
revision = "1.0"

[providers]
sops_openclaw_mini = "sops://modules/ai/ai-openclaw/secrets/mini.yaml"

[profiles.mini]
openclaw_gateway_token = { description = "openclaw gateway auth token", providers = ["host_op_mini", "sops_openclaw_mini"] }
openrouter_api_key = { description = "OpenRouter API key for the openclaw agent", providers = ["host_op_mini", "sops_openclaw_mini"] }
kagi_api_key = { description = "Kagi MCP API key", providers = ["host_op_mini", "sops_openclaw_mini"] }
proton_bridge_username = { description = "Proton Mail bridge username", providers = ["host_op_mini", "sops_openclaw_mini"] }
proton_bridge_password = { description = "Proton Mail bridge password", providers = ["host_op_mini", "sops_openclaw_mini"] }

[scopes.openclaw]
secrets = [
  "openclaw_gateway_token",
  "openrouter_api_key",
  "kagi_api_key",
  "proton_bridge_username",
  "proton_bridge_password",
]
