# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the step-ca module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "step-ca"
revision = "1.0"

[providers]
sops_stepca_cicero = "sops://modules/identity/identity-step-ca/secrets/cicero.yaml"

[profiles.cicero]
yk_pin = { description = "YubiKey PIV PIN (yk-pin.txt template -> step-ca KMS pin-source) (LIFELINE)", providers = ["sops_stepca_cicero"] }
intermediate_crt_password = { description = "intermediate cert password (services.step-ca.intermediatePasswordFile) (LIFELINE)", providers = ["sops_stepca_cicero"] }

[scopes.step-ca]
secrets = [
  "yk_pin",
  "intermediate_crt_password",
]
