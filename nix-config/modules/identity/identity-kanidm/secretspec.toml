# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the kanidm module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs. ALL provider aliases
# are bound by the ROOT manifest (nix-config/secretspec.toml): relative
# sops:// URIs resolve against the root manifest's directory, and
# multi-level ../ paths break URL dot-segment normalization — the root
# binds forward-relative paths only. See docs/secretspec-migration-plan.md.

[project]
name = "kanidm"
revision = "1.0"

[profiles.augustus]
kanidm_admin_passphrase = { description = "kanidm admin passphrase (provision.adminPasswordFile)", providers = ["host_op_augustus", "sops_kanidm"] }
kanidm_idm_admin_passphrase = { description = "kanidm idm admin passphrase (provision + kanidm-posix)", providers = ["host_op_augustus", "sops_kanidm"] }
kanidm_restic_backup_passphrase = { description = "restic repo passphrase for kanidm backups", providers = ["host_op_augustus", "sops_kanidm"] }

[scopes.kanidm]
secrets = [
  "kanidm_admin_passphrase",
  "kanidm_idm_admin_passphrase",
  "kanidm_restic_backup_passphrase",
]
