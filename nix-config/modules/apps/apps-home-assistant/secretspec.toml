# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the home-assistant module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs.
#
# sops:// alias paths below are spelled RELATIVE TO THE ROOT MANIFEST
# (nix-config/secretspec.toml): relative provider URIs are rebased against
# the root manifest's directory, and multi-level ../ paths break URL
# dot-segment normalization — forward-relative only. host_op_* placeholders
# are bound by the root. See docs/secretspec-migration-plan.md §4.1.

[project]
name = "home-assistant"
revision = "1.0"

[providers]
sops_home_assistant = "sops://modules/apps/apps-home-assistant/secrets/augustus.yaml"

[profiles.augustus]
home_assistant_client_secret = { description = "OIDC client secret (kanidm-issued; secrets.yaml template)", providers = ["host_op_augustus", "sops_home_assistant"] }
home_assistant_lat = { description = "latitude (secrets.yaml template)", providers = ["host_op_augustus", "sops_home_assistant"] }
home_assistant_long = { description = "longitude (secrets.yaml template)", providers = ["host_op_augustus", "sops_home_assistant"] }

[scopes.home-assistant]
secrets = [
  "home_assistant_client_secret",
  "home_assistant_lat",
  "home_assistant_long",
]
