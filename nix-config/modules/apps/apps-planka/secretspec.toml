# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the planka module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs. ALL provider aliases
# are bound by the ROOT manifest (nix-config/secretspec.toml): relative
# sops:// URIs resolve against the root manifest's directory, and
# multi-level ../ paths break URL dot-segment normalization — the root
# binds forward-relative paths only. See docs/secretspec-migration-plan.md.

[project]
name = "planka"
revision = "1.0"

[profiles.augustus]
planka_secret_key = { description = "PLANKA_SECRET_KEY", providers = ["host_op_augustus", "sops_planka"] }
planka_db_pass = { description = "planka postgres password (group planka-db-pass)", providers = ["host_op_augustus", "sops_planka"] }
planka_client_secret = { description = "OIDC client secret (kanidm-issued; planka-client-secret template)", providers = ["host_op_augustus", "sops_planka"] }
planka_default_admin_pass = { description = "default admin password (first-boot)", providers = ["host_op_augustus", "sops_planka"] }
planka_restic_backup_passphrase = { description = "restic repo passphrase for planka backups", providers = ["host_op_augustus", "sops_planka"] }

[scopes.planka]
secrets = [
  "planka_secret_key",
  "planka_db_pass",
  "planka_client_secret",
  "planka_default_admin_pass",
  "planka_restic_backup_passphrase",
]
