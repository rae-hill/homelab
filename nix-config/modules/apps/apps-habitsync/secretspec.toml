# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the habitsync module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs. ALL provider aliases
# are bound by the ROOT manifest (nix-config/secretspec.toml): relative
# sops:// URIs resolve against the root manifest's directory, and
# multi-level ../ paths break URL dot-segment normalization — the root
# binds forward-relative paths only. See docs/secretspec-migration-plan.md.

[project]
name = "habitsync"
revision = "1.0"

[profiles.augustus]
habitsync_db_pass = { description = "habitsync postgres password (habitsync-env template)", providers = ["host_op_augustus", "sops_habitsync"] }
habitsync_jwt_secret = { description = "habitsync JWT signing secret (habitsync-env template)", providers = ["host_op_augustus", "sops_habitsync"] }
habitsync_restic_backup_passphrase = { description = "restic repo passphrase for habitsync backups", providers = ["host_op_augustus", "sops_habitsync"] }

[scopes.habitsync]
secrets = [
  "habitsync_db_pass",
  "habitsync_jwt_secret",
  "habitsync_restic_backup_passphrase",
]
