# :schema https://secretspec.dev/schema/secretspec.schema.json

# Secret declarations for the minecraft module, one profile per host that
# runs it. Names match the sops yaml keys verbatim (lowercase) so the sops
# provider's flat-key lookup resolves without refs. ALL provider aliases
# are bound by the ROOT manifest (nix-config/secretspec.toml): relative
# sops:// URIs resolve against the root manifest's directory, and
# multi-level ../ paths break URL dot-segment normalization — the root
# binds forward-relative paths only. See docs/secretspec-migration-plan.md.

[project]
name = "minecraft"
revision = "1.0"

[profiles.augustus]
minecraft_backup_passphrase = { description = "restic repo passphrase for minecraft backups", providers = ["host_op_augustus", "sops_minecraft"] }

[scopes.minecraft]
secrets = [
  "minecraft_backup_passphrase",
]
