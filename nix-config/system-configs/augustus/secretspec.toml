# :schema https://secretspec.dev/schema/secretspec.schema.json

# augustus host-specific secrets — the ones declared by host-* Nix modules
# (host-augustus-{system,filesystems,programs}) that no shared service module
# owns. Loaded via extends from the root manifest (nix-config/secretspec.toml);
# sops:// paths are spelled RELATIVE TO THE ROOT MANIFEST DIR (nix-config/) —
# forward-relative only (see plan §4.1). Scope names are host-qualified:
# same-named scopes in different documents REPLACE (never union).

[project]
name = "host-augustus"
revision = "1.0"

[providers]
sops_smb_augustus = "sops://system-configs/augustus/secrets/smb.yaml"
sops_failure_notifs_augustus = "sops://system-configs/augustus/secrets/failure-notifs.yaml"
sops_postgres_augustus = "sops://system-configs/augustus/secrets/postgres.yaml"
sops_stepca_oidc_augustus = "sops://system-configs/augustus/secrets/step-ca.yaml"
sops_api_extras_augustus = "sops://system-configs/augustus/secrets/homelab-api.yaml"

[profiles.augustus]
smb_passphrase = { description = "CIFS passphrase for the /mnt/backups automount (smb-creds template)", providers = ["sops_smb_augustus"] }
pushover_user_key = { description = "Pushover user key for failure-notifs", providers = ["host_op_augustus", "sops_failure_notifs_augustus"] }
pushover_token = { description = "Pushover API token for failure-notifs", providers = ["host_op_augustus", "sops_failure_notifs_augustus"] }
postgres_restic_backup_passphrase = { description = "restic repo passphrase for the postgres dump backup", providers = ["host_op_augustus", "sops_postgres_augustus"] }
step_ca_oidc_client_secret = { description = "kanidm-issued OIDC client secret for step-ca", providers = ["host_op_augustus", "sops_stepca_oidc_augustus"] }
homelab_api_key_jacob = { description = "homelab-api personal API key (jacob)", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
homelab_api_openrouter_key = { description = "OpenRouter key for POST /resume/tailor", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
ipad_serial_number = { description = "iPad serial for the EAP-TLS serial-numbers-file", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
iphone_serial_number = { description = "iPhone serial for the EAP-TLS serial-numbers-file", providers = ["host_op_augustus", "sops_api_extras_augustus"] }
# NOTE: secrets/step-ca.yaml also carries step_ca_ssh_host_augustus_provisioner_passphrase,
# declared by NOTHING (dead key carried through both migrations).

[scopes.smb-augustus]
secrets = ["smb_passphrase"]

[scopes.failure-notifs-augustus]
secrets = ["pushover_user_key", "pushover_token"]

[scopes.postgres-backup-augustus]
secrets = ["postgres_restic_backup_passphrase"]

[scopes.step-ca-oidc-augustus]
secrets = ["step_ca_oidc_client_secret"]

[scopes.homelab-api-extras-augustus]
secrets = [
  "homelab_api_key_jacob",
  "homelab_api_openrouter_key",
  "ipad_serial_number",
  "iphone_serial_number",
]
