# :schema https://secretspec.dev/schema/secretspec.schema.json

# aedilis (public DNS) host-specific secrets — declared beside the host module
# (aedilis/technitium.nix) that consumes them. LIFELINE class (plan §6): local
# encrypted files permanently, no host_op in any chain. sops:// paths are
# spelled RELATIVE TO THE ROOT MANIFEST DIR (nix-config/) — forward-relative
# only (plan §4.1).

[project]
name = "host-aedilis"
revision = "1.0"

[providers]
sops_technitium_aedilis = "sops://system-configs/aedilis/secrets/technitium.yaml"

[profiles.aedilis]
technitium_admin_password = { description = "technitium web console admin password (first-start bootstrap)", providers = ["sops_technitium_aedilis"] }
technitium_sso_client_secret = { description = "OIDC/SSO client secret for the kanidm-registered technitium client", providers = ["sops_technitium_aedilis"] }
technitium_pkcs12_password = { description = "PKCS#12 bundle password for the DoT/DoQ/DoH listener", providers = ["sops_technitium_aedilis"] }
technitium_metrics_user_password = { description = "password of the limited prometheus metrics user", providers = ["sops_technitium_aedilis"] }
technitium_provisioner_password = { description = "password of the least-privilege provisioner API user (token broker)", providers = ["sops_technitium_aedilis"] }
technitium_metrics_totp_secret = { description = "TOTP seed of the metrics user — NOT consumed by Nix config; captured out-of-band per the deployment runbook §7", required = false, providers = ["sops_technitium_aedilis"] }

[scopes.technitium-aedilis]
secrets = [
  "technitium_admin_password",
  "technitium_sso_client_secret",
  "technitium_pkcs12_password",
  "technitium_metrics_user_password",
  "technitium_provisioner_password",
  "technitium_metrics_totp_secret",
]
