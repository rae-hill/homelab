# :schema https://secretspec.dev/schema/secretspec.schema.json

# nixos workstation host-specific secrets (host-nixos-filesystems smb mounts).
# The opencode + ssh-cert-renewer secrets of this host come from their module
# parents via the root manifest. sops:// paths are spelled RELATIVE TO THE
# ROOT MANIFEST DIR (nix-config/) — forward-relative only (plan §4.1).

[project]
name = "host-nixos"
revision = "1.0"

[providers]
sops_smb_nixos = "sops://system-configs/nixos/secrets/smb.yaml"

[profiles.nixos]
smb_passphrase = { description = "CIFS passphrase for the /mnt/backups automount (smb-creds template)", providers = ["sops_smb_nixos"] }
jacob_smb_passphrase = { description = "CIFS passphrase for /home/jacob/cloud (jacob-smb-creds template)", providers = ["sops_smb_nixos"] }

[scopes.smb-nixos]
secrets = ["smb_passphrase", "jacob_smb_passphrase"]
