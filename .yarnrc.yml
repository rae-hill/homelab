enableGlobalCache: false
nmMode: hardlinks-local
nodeLinker: node-modules
npmMinimalAgeGate: "5d"

packageExtensions:
  "@astrojs/solid-js@*":
    peerDependencies:
      solid-devtools: "*"
  # @anolilab/multi-semantic-release loads its config through @visulima/fs,
  # which statically imports its optional peer parsers (yaml/json5/jsonc/toml/
  # ini). Optional peers are not installed by yarn, so declare them here or
  # MSR crashes with ERR_MODULE_NOT_FOUND while probing for config files.
  "@visulima/fs@*":
    dependencies:
      "@visulima/yaml": "2.0.0"
      ini: "^7.0.0"
      json5: "^2.2.3"
      jsonc-parser: "^3.3.1"
      smol-toml: "^1.8.1"
  "@effect/platform-node@*":
    peerDependencies:
      bufferutil: ^4.0.1
      utf-8-validate: ">=5.0.2"
