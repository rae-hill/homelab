# :schema https://secretspec.dev/schema/secretspec.schema.json

# Development/e2e SecretSpec manifest — ephemeral GENERATED secrets for the
# local dev + e2e fixture pipeline (docs/secretspec-migration-plan.md Phase 2).
# Distinct project from the fleet manifest (nix-config/secretspec.toml, which
# wins for commands run under nix-config/ — discovery walks up from CWD).
#
# No durable storage anywhere: every value is generated fresh per
# `secretspec run` by the null provider (one generation event per invocation;
# children of a single run share values). scripts/stage-e2e-secrets.mjs is the
# sole consumer: it reads the injected env and assembles the gitignored
# fixture files (private/jwk-secret, private/hmac-secret, the JWE-wrapped
# private/jwk.json) that homelab-server's file-path env contract
# (HOMELAB_SECRET_FILE, TOKEN_ISSUER_PRIVATE_KEY_SECRET_PATH, ...) points at.
# The JWE is only decryptable with the matching passphrase, so in injected
# mode the script regenerates the derived fixtures EVERY run (same generation
# event). Without injection (e.g. CI runners without Nix) the script falls
# back to self-generating with its legacy never-overwrite behavior.
#
# require_reason = false: these are throwaway values (generated per run, no
# production contact), and resolution must stay frictionless inside
# scripts/e2e.sh, devshell commands, and CI. The fleet manifest keeps
# require_reason = "agents".
#
# Usage:
#   secretspec run --profile e2e -- node scripts/stage-e2e-secrets.mjs
#       (scripts/e2e.sh does this automatically when secretspec is on PATH)
#   seed-secrets   (devshell: same, development profile — then run watch
#       commands like `yarn workspace homelab-server dev` as usual)

[project]
name = "homelab-dev"
revision = "1.0"
require_reason = false

[providers]
ephemeral = "null://"

# development = human dev-machine fixture seeding (watch commands read the
# staged files afterwards); e2e = per-suite-run fixtures (scripts/e2e.sh).
# Identical sets for now; `development` can later grow a keyring/1Password-
# desktop provider chain for stable values in hand-tuned workflows.
[profiles.development]
JWK_PASSPHRASE = { description = "PBES2 passphrase protecting the generated token-issuer JWK (private/jwk-secret; the private/jwk.json JWE is re-wrapped with it every injected run)", type = "password", generate = { length = 43, charset = "alphanumeric" }, providers = ["ephemeral"] }
HMAC_SECRET = { description = "Nonce HMAC secret, 64 hex chars (private/hmac-secret; server reads it via HOMELAB_SECRET_FILE)", type = "hex", generate = { bytes = 32 }, providers = ["ephemeral"] }

[profiles.e2e]
JWK_PASSPHRASE = { description = "PBES2 passphrase protecting the generated token-issuer JWK (private/jwk-secret; the private/jwk.json JWE is re-wrapped with it every injected run)", type = "password", generate = { length = 43, charset = "alphanumeric" }, providers = ["ephemeral"] }
HMAC_SECRET = { description = "Nonce HMAC secret, 64 hex chars (private/hmac-secret; server reads it via HOMELAB_SECRET_FILE)", type = "hex", generate = { bytes = 32 }, providers = ["ephemeral"] }

[scopes.server]
secrets = ["JWK_PASSPHRASE", "HMAC_SECRET"]
